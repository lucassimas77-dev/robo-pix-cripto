# Configuração automática para 1 clique no Render.com (Plano Gratuito, sem cartão)
services:
  - type: web
    name: robo-pix-cripto
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "3000"
      - key: REQUIRE_PAYER_DOCUMENT
        value: "false"
