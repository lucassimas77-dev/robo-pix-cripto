# Configuração Node.js Nativo para Plano Gratuito sem Cartão no Render.com
services:
  - type: web
    name: robo-pix-cripto
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: REQUIRE_PAYER_DOCUMENT
        value: "false"
